{%extends 'mail/base.html'%}
{%block content%}
<div class="bd-example m-0 border-0">
    <div class="card" style="width: 50rem;">
        <div class="card-body">
            <h5 class="card-title">Удалить {{object.name}}?</h5>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <button class="btn active btn-danger" type="submit">Удалить</button>
                <a class="btn active" type="submit" href="{% url 'mail:clients_list' %}">Отменить</a>
            </form>
        </div>
    </div>
</div>
{%endblock%}
